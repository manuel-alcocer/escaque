---
# Django SECRET_KEY. Generated once and never rotated (refreshInterval "0"):
# rotating it would invalidate every issued JWT and log everyone out.
# No symbols, so it survives unquoted in env vars.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: escaque-secret-key
  namespace: escaque
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  length: 64
  digits: 16
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
# Application PostgreSQL password (no symbols so it survives unencoded inside
# the DATABASE_URL below).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: escaque-db-password
  namespace: escaque
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  length: 48
  digits: 12
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
# One Secret carries both shapes of the same password: POSTGRES_PASSWORD for the
# init Job's psql, and the assembled DATABASE_URL that django-environ reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: escaque-db
  namespace: escaque
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "0"
  target:
    name: escaque-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        POSTGRES_PASSWORD: "{{ .db_password }}"
        DATABASE_URL: "postgres://escaque:{{ .db_password }}@postgresql.databases.svc.cluster.local:5432/escaque"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: escaque-db-password
      rewrite:
        - transform:
            template: "db_password"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: escaque-django
  namespace: escaque
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "0"
  target:
    name: escaque-django
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: escaque-secret-key
---
# Shared PostgreSQL superuser password, read from the databases namespace so the
# init Job can create the escaque role and database.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-auth-shared
  namespace: escaque
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-databases
    kind: ClusterSecretStore
  target:
    name: postgresql-auth-shared
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: postgresql-auth
        property: postgres-password

namespace: escaque

resources:
  - namespace.yml
  - configmap.yml
  - secrets.yml
  - db-init-job.yml
  - stockfish.yml
  - backend.yml
  - frontend.yml
  - migrate-job.yml

# Bumped by CI (.github/workflows/release.yml) on every push to main: it builds
# the three multi-arch images, rewrites the `newTag`s below and commits them back
# ([skip ci]). ArgoCD watches main and redeploys when they change — no manual
# `kubectl rollout restart`. All three share the same tag.
images:
  - name: ghcr.io/manuel-alcocer/escaque-backend
    newTag: main-5bb34b9cb4a34aa082b1ffdd0c9e3f83274b7cac
  - name: ghcr.io/manuel-alcocer/escaque-frontend
    newTag: main-5bb34b9cb4a34aa082b1ffdd0c9e3f83274b7cac
  - name: ghcr.io/manuel-alcocer/escaque-stockfish
    newTag: main-5bb34b9cb4a34aa082b1ffdd0c9e3f83274b7cac

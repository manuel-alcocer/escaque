# The chess engine, as its own workload.
#
# Stateless: each analysis request opens a TCP connection, socat forks a
# Stockfish process for it, and that process exits when the request ends. So it
# scales by replicas and only CPU matters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escaque-stockfish
  namespace: escaque
  labels:
    app.kubernetes.io/name: stockfish
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stockfish
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stockfish
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      # A search is pure CPU and ultron (amd64) is much faster than the Orange
      # Pi nodes. Preferred, not required: the image is multi-arch, so ARM is a
      # working fallback if ultron is unavailable.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ['amd64']
      containers:
        - name: stockfish
          image: ghcr.io/manuel-alcocer/escaque-stockfish:latest
          ports:
            - name: uci
              containerPort: 23249
          env:
            - name: ENGINE_PORT
              value: '23249'
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: '2'
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: uci
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: uci
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: escaque-stockfish
  namespace: escaque
spec:
  selector:
    app.kubernetes.io/name: stockfish
  ports:
    - name: uci
      port: 23249
      targetPort: uci

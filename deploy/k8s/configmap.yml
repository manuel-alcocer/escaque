apiVersion: v1
kind: ConfigMap
metadata:
  name: escaque-config
  namespace: escaque
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  DEBUG: 'False'
  # cloudflared reaches the frontend Service in-cluster and forwards the public
  # Host header, so Django must accept the public name as well as the Service DNS.
  ALLOWED_HOSTS: 'escaque.linuxarena.net,escaque-backend,escaque-backend.escaque.svc.cluster.local,localhost,127.0.0.1'
  CSRF_TRUSTED_ORIGINS: 'https://escaque.linuxarena.net'
  # Same origin in production: nginx in the frontend pod proxies /api, so the
  # browser never makes a cross-origin request and this stays empty in practice.
  CORS_ALLOWED_ORIGINS: 'https://escaque.linuxarena.net'
  STOCKFISH_HOST: 'escaque-stockfish'
  STOCKFISH_PORT: '23249'
  STOCKFISH_TIMEOUT: '10'
  STOCKFISH_DEFAULT_MOVETIME: '600'
  # Capped lower than the local default: the ARM nodes are slower and cloudflared
  # holds the connection open the whole time.
  STOCKFISH_MAX_MOVETIME: '2500'
  ACCESS_TOKEN_LIFETIME_MINUTES: '120'
  REFRESH_TOKEN_LIFETIME_DAYS: '30'
